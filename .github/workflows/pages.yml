# Builds the docs site (tools/build-site.js → site/docs/*.html), pulls the tutorial MP4s from the
# tutorials-v1 release into site/videos/ (they are too big for git), and deploys site/ to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the docs site
        run: node tools/build-site.js
      - name: Fetch the tutorial videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download tutorials-v1 --pattern 'tut-*.mp4' --dir site/videos
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
