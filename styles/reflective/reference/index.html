<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Does devotion guarantee success?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600;1,9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="../../runtime/animations.jsx"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0b0906; overflow: hidden; }
    #root { width: 100%; height: 100vh; position: relative; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
// ── Style (owner-approved override: warm reflective, not the red tech brand) ──
const BG = '#0b0906';
const GOLD = '#e0a458';
const GOLD2 = '#f2c46d';
const CREAM = '#f5efe6';
const SERIF = "'Fraunces', Georgia, serif";
const COND = "'Manrope', sans-serif";
const BODY = "'Manrope', sans-serif";
const TS = '0 2px 22px rgba(0,0,0,0.65), 0 1px 3px rgba(0,0,0,0.5)';
const GLOW_TS = '0 0 28px rgba(242,196,109,0.55), 0 2px 16px rgba(0,0,0,0.6)';
const img = (n) => `images/${n}.jpg`;

// ── Motion helpers (all pure functions of time) ────────────────────────────────
const e3 = (t) => Easing.easeOutCubic(clamp(t, 0, 1));
const eio = (t) => Easing.easeInOutCubic(clamp(t, 0, 1));
const after = (lt, cue, d) => e3((lt - cue) / d);

// Entry styles. Every text overlay is enter-only (no early exits).
function slideUp(localTime, inDur = 0.45) {
  const t = clamp(localTime / inDur, 0, 1);
  const e = Easing.easeOutCubic(t);
  return { opacity: e, transform: `translateY(${(1 - e) * 22}px)` };
}
function rise(lt, cue, d = 0.5, dist = 28) {
  const p = after(lt, cue, d);
  return { opacity: p, transform: `translateY(${(1 - p) * dist}px)` };
}
function pop(lt, cue, k = 200, d = 14) {
  const s = spring(lt - cue, k, d);
  return { opacity: clamp((lt - cue) / 0.15, 0, 1), transform: `scale(${0.5 + 0.5 * s})` };
}
function reveal(lt, cue, d = 0.6) {
  const p = eio((lt - cue) / d);
  return { clipPath: `inset(0 ${(1 - p) * 100}% 0 0)`, transform: `translateX(${(1 - p) * -16}px)`, opacity: p > 0 ? 1 : 0 };
}
function blurIn(lt, cue, d = 0.6) {
  const p = after(lt, cue, d);
  return { opacity: p, filter: `blur(${(1 - p) * 14}px)`, transform: `scale(${1.1 - 0.1 * p})` };
}
function drop(lt, cue) {
  const s = spring(lt - cue, 260, 17);
  return { opacity: clamp((lt - cue) / 0.12, 0, 1), transform: `translateY(${(1 - s) * -70}px)` };
}

// ── Photo layers ────────────────────────────────────────────────────────────────
// One shot: Ken Burns zoom + drift over its own lifetime.
function Shot({ src, t, dur, pos = 'center', z0 = 1.04, z1 = 1.14, x0 = 0, x1 = 0, y0 = 0, y1 = 0, filter }) {
  const p = Easing.easeInOutSine(clamp(t / Math.max(0.01, dur), 0, 1));
  const s = z0 + (z1 - z0) * p;
  const x = x0 + (x1 - x0) * p;
  const y = y0 + (y1 - y0) * p;
  return (
    <img src={img(src)} alt="" style={{
      position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', objectPosition: pos,
      transform: `scale(${s}) translate(${x}%, ${y}%)`, transformOrigin: 'center', filter,
    }} />
  );
}

// Transition style for an incoming layer, e = 0..1.
function trStyle(type, e) {
  switch (type) {
    case 'wipe':   return { clipPath: `inset(0 ${(1 - e) * 100}% 0 0)` };
    case 'wipeUp': return { clipPath: `inset(${(1 - e) * 100}% 0 0 0)` };
    case 'iris':   return { clipPath: `circle(${e * 76}% at 50% 50%)` };
    case 'zoom':   return { opacity: e, transform: `scale(${1.3 - 0.3 * e})` };
    case 'slide':  return { transform: `translateX(${(1 - e) * 100}%)` };
    case 'blur':   return { opacity: e, filter: `blur(${(1 - e) * 16}px)` };
    default:       return { opacity: e };
  }
}

// Sequence of shots cut on word cues. shots: [{ src, at, tr, ...kenBurns }]
function PhotoSeq({ lt, dur, shots, trDur = 0.5, filter, height = '100%', top = 0 }) {
  let a = 0;
  for (let i = 0; i < shots.length; i++) if (lt >= shots[i].at) a = i;
  const layer = (i, style) => {
    const s = shots[i];
    const end = i < shots.length - 1 && isFinite(shots[i + 1].at) ? shots[i + 1].at + trDur : dur;
    return (
      <div key={i} style={{ position: 'absolute', inset: 0, overflow: 'hidden', ...style }}>
        <Shot {...s} filter={s.filter || filter} t={lt - s.at} dur={Math.max(0.5, end - s.at)} />
      </div>
    );
  };
  const tp = a > 0 ? clamp((lt - shots[a].at) / trDur, 0, 1) : 1;
  return (
    <div style={{ position: 'absolute', left: 0, right: 0, top, height, overflow: 'hidden', background: BG }}>
      {a > 0 && tp < 1 && layer(a - 1, {})}
      {layer(a, a > 0 ? trStyle(shots[a].tr || 'dissolve', eio(tp)) : {})}
    </div>
  );
}

// Warm dark grades so text always reads over photos.
function Grade({ kind = 'topbottom', dim = 0 }) {
  const bgs = {
    topbottom: 'linear-gradient(to bottom, rgba(11,9,6,0.9) 0%, rgba(11,9,6,0.5) 26%, rgba(11,9,6,0.22) 48%, rgba(11,9,6,0.5) 70%, rgba(11,9,6,0.94) 100%)',
    left: 'linear-gradient(to right, rgba(11,9,6,0.92) 0%, rgba(11,9,6,0.7) 52%, rgba(11,9,6,0.3) 100%), linear-gradient(to bottom, rgba(11,9,6,0.7) 0%, rgba(11,9,6,0) 30%, rgba(11,9,6,0) 65%, rgba(11,9,6,0.92) 100%)',
    center: 'radial-gradient(ellipse 80% 55% at 50% 50%, rgba(11,9,6,0.55) 0%, rgba(11,9,6,0.2) 70%), linear-gradient(to bottom, rgba(11,9,6,0.9) 0%, rgba(11,9,6,0.35) 30%, rgba(11,9,6,0.35) 65%, rgba(11,9,6,0.94) 100%)',
  };
  return (
    <React.Fragment>
      <div style={{ position: 'absolute', inset: 0, background: bgs[kind] }} />
      <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(165deg, rgba(242,196,109,0.14) 0%, rgba(11,9,6,0) 45%, rgba(224,164,88,0.10) 100%)', mixBlendMode: 'screen' }} />
      {dim > 0 && <div style={{ position: 'absolute', inset: 0, background: `rgba(11,9,6,${dim})` }} />}
    </React.Fragment>
  );
}

// Soft light orb (the "inner peace" motif). Pulses on a time-driven sine.
function Glow({ x, y, r, strength = 1, lt }) {
  const pulse = 1 + 0.05 * Math.sin(lt * 2.2);
  const R = r * pulse;
  return (
    <div style={{
      position: 'absolute', left: x - R, top: y - R, width: R * 2, height: R * 2, borderRadius: '50%',
      background: 'radial-gradient(circle, rgba(255,226,160,0.62) 0%, rgba(242,196,109,0.34) 26%, rgba(224,164,88,0.12) 52%, rgba(224,164,88,0) 70%)',
      opacity: strength, mixBlendMode: 'screen', pointerEvents: 'none',
    }} />
  );
}

// Scene entry transitions — each runs in the 0.5 s scene overlap, over the outgoing scene.
function Enter({ type, lt, children }) {
  const p = eio(lt / 0.5);
  let inner = {};
  let edge = null;
  if (type === 'wipe') {
    inner = { clipPath: `inset(0 ${(1 - p) * 100}% 0 0)` };
    if (p < 1) edge = <div style={{ position: 'absolute', top: 0, bottom: 0, left: p * 720 - 70, width: 140, background: 'linear-gradient(to right, rgba(242,196,109,0), rgba(255,230,170,0.95), rgba(242,196,109,0))', filter: 'blur(8px)', mixBlendMode: 'screen' }} />;
  } else if (type === 'wipeUp') {
    inner = { clipPath: `inset(${(1 - p) * 100}% 0 0 0)` };
    if (p < 1) edge = <div style={{ position: 'absolute', left: 0, right: 0, top: (1 - p) * 1280 - 70, height: 140, background: 'linear-gradient(to bottom, rgba(242,196,109,0), rgba(255,230,170,0.95), rgba(242,196,109,0))', filter: 'blur(8px)', mixBlendMode: 'screen' }} />;
  } else if (type === 'push') {
    inner = { transform: `translateX(${(1 - p) * 100}%)`, boxShadow: '-30px 0 60px rgba(0,0,0,0.6)' };
  } else if (type === 'zoom') {
    inner = { opacity: p, transform: `scale(${1.4 - 0.4 * p})` };
  } else if (type === 'iris') {
    inner = { clipPath: `circle(${p * 76}% at 50% 50%)` };
    const R = p * 0.76 * 1040;
    if (p < 1) edge = <div style={{ position: 'absolute', left: 360 - R, top: 640 - R, width: R * 2, height: R * 2, borderRadius: '50%', border: '4px solid rgba(242,196,109,0.9)', boxShadow: '0 0 30px rgba(242,196,109,0.8)' }} />;
  } else if (type === 'glow') {
    inner = { opacity: p };
    const f = Math.sin(Math.PI * clamp(lt / 0.5, 0, 1));
    if (lt < 0.5) edge = <div style={{ position: 'absolute', inset: 0, opacity: 0.9 * f, background: 'radial-gradient(ellipse at 55% 45%, rgba(255,240,205,1) 0%, rgba(242,196,109,0.85) 35%, rgba(224,164,88,0.3) 70%, rgba(11,9,6,0) 100%)', mixBlendMode: 'screen' }} />;
  } else if (type === 'dissolve') {
    inner = { opacity: p };
  }
  return (
    <div style={{ position: 'absolute', inset: 0 }}>
      <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', background: BG, ...inner }}>{children}</div>
      {edge}
    </div>
  );
}

// ── Typographic building blocks ───────────────────────────────────────────────
function Label({ lt, cue, text, top, left = 56, center = false, color = GOLD, size = 24 }) {
  const line = after(lt, cue, 0.5);
  return (
    <div style={{
      position: 'absolute', top, left: center ? 0 : left, right: center ? 0 : undefined,
      display: 'flex', alignItems: 'center', justifyContent: center ? 'center' : 'flex-start', gap: 14,
    }}>
      <div style={{ width: 44 * line, height: 2, background: color }} />
      <div style={{
        fontFamily: COND, fontWeight: 700, fontSize: size, letterSpacing: '0.24em', textTransform: 'uppercase',
        color, textShadow: TS, ...reveal(lt, cue + 0.1, 0.5),
      }}>{text}</div>
      {center && <div style={{ width: 44 * line, height: 2, background: color }} />}
    </div>
  );
}

function Chip({ children, style, size = 42 }) {
  return (
    <div style={{
      display: 'inline-block', padding: '6px 26px 10px', borderRadius: 999,
      border: `2px solid ${GOLD}`, background: 'rgba(11,9,6,0.62)',
      fontFamily: SERIF, fontStyle: 'italic', fontWeight: 500, fontSize: size, color: CREAM, lineHeight: 1.15,
      whiteSpace: 'nowrap', ...style,
    }}>{children}</div>
  );
}

function StrikeLine({ p, rot = -4, thick = 7 }) {
  return (
    <div style={{
      position: 'absolute', left: '-4%', top: '54%', height: thick, width: `${p * 108}%`,
      background: GOLD2, borderRadius: thick, transform: `rotate(${rot}deg)`, transformOrigin: 'left center',
      boxShadow: '0 0 18px rgba(242,196,109,0.75)',
    }} />
  );
}

// ── Scene 1 · Hook: the question ──────────────────────────────────────────────
function Scene1() {
  const win = useSceneWindow(1);
  const cGod = useWordCue(1, "god");
  const cGuar = useWordCue(1, "guarantee");
  const cSucc = useWordCue(1, "successful");
  const cPeace = useWordCue(1, "peaceful");
  const cThink = useWordCue(1, "lets think");
  return (
    <Sprite {...win}>{({ localTime: lt, duration }) => {
      const strike = eio((lt - cThink - 0.15) / 0.55);
      return (
        <div style={{ position: 'absolute', inset: 0, background: BG, overflow: 'hidden' }}>
          <PhotoSeq lt={lt} dur={duration} shots={[
            { src: 'hand-rays', at: 0, z0: 1.32, z1: 1.06, x0: 1.5, x1: -1.5, y0: -2, y1: 1 },
            { src: 'sea-sunrise', at: cPeace, tr: 'wipe', z0: 1.14, z1: 1.04, y0: 1, y1: -1 },
          ]} />
          <Grade kind="topbottom" />
          <div style={{
            position: 'absolute', right: -70, top: 330, fontFamily: SERIF, fontStyle: 'italic', fontWeight: 700,
            fontSize: 700, lineHeight: 1, color: GOLD2, opacity: 0.24, mixBlendMode: 'screen',
            transform: `rotate(${-10 + lt * 1.8}deg) translateY(${-lt * 8}px)`,
          }}>?</div>
          <Label lt={lt} cue={0} top={128} text="A question worth asking" />
          <div style={{ position: 'absolute', left: 56, right: 40, top: 178, fontFamily: SERIF, fontWeight: 700, fontSize: 74, lineHeight: 1.06, color: CREAM, textShadow: TS }}>
            <div style={rise(lt, 0.05, 0.45)}>Does devotion</div>
            <div style={rise(lt, cGod, 0.45)}>to God</div>
          </div>
          <div style={{ position: 'absolute', left: 50, top: 336, ...blurIn(lt, cGuar, 0.45) }}>
            <span style={{
              position: 'relative', display: 'inline-block', padding: '0 10px',
              fontFamily: SERIF, fontStyle: 'italic', fontWeight: 700, fontSize: 112, lineHeight: 1.1,
              color: strike > 0.5 ? 'rgba(245,239,230,0.6)' : GOLD2, textShadow: GLOW_TS,
            }}>
              guarantee
              <StrikeLine p={strike} />
            </span>
          </div>
          <div style={{ position: 'absolute', left: 56, top: 500, display: 'flex', gap: 18, alignItems: 'center' }}>
            <Chip style={{ ...pop(lt, cSucc), transformOrigin: 'left center' }}>success</Chip>
            <div style={{ fontFamily: SERIF, fontSize: 44, color: GOLD2, textShadow: TS, ...pop(lt, cPeace + 0.05) }}>&amp;</div>
            <Chip style={{ ...pop(lt, cPeace), transformOrigin: 'left center' }}>peace</Chip>
            <div style={{ fontFamily: SERIF, fontStyle: 'italic', fontWeight: 700, fontSize: 70, color: GOLD2, textShadow: GLOW_TS, ...pop(lt, cThink + 0.2, 220, 12) }}>?</div>
          </div>
          <SubtitleRail sceneIdx={1} bottom={170} fontSize={26} variant="clean" accentColor={GOLD2} />
        </div>
      );
    }}</Sprite>
  );
}

// ── Scene 2 · Split screen: devoted & struggling vs not religious & at peace ──
function Scene2() {
  const win = useSceneWindow(2);
  const cDeep = useWordCue(2, "deeply devoted");
  const cStr = useWordCue(2, "struggle");
  const cArent = useWordCue(2, "arent very");
  const cSucc = useWordCue(2, "successful meaningful");
  const cMean = useWordCue(2, "meaningful");
  const cPeace = useWordCue(2, "peaceful");
  const cSo = useWordCue(2, "so devotion");
  const cDec = useWordCue(2, "decides");
  return (
    <Sprite {...win}>{({ localTime: lt, duration }) => {
      const lit = after(lt, cArent, 0.9);
      const seam = spring(lt - 0.15, 180, 22);
      const band = spring(lt - cSo, 200, 22);
      return (
        <Enter type="wipe" lt={lt}>
          {/* top half — struggle, cool and desaturated */}
          <PhotoSeq lt={lt} dur={duration} top={0} height={640} filter="grayscale(0.55) brightness(1.0) contrast(1.08)" shots={[
            { src: 'rain-window', at: 0, z0: 1.18, z1: 1.04 },
            { src: 'storm', at: cStr, tr: 'dissolve', z0: 1.05, z1: 1.2, x0: -2, x1: 2 },
          ]} />
          <div style={{ position: 'absolute', left: 0, right: 0, top: 0, height: 640, background: 'linear-gradient(to bottom, rgba(11,9,6,0.55), rgba(11,9,6,0.15) 40%, rgba(11,9,6,0.85))' }} />
          {/* bottom half — lights up warm on "aren't very religious" */}
          <PhotoSeq lt={lt} dur={duration} top={640} height={640} filter={`grayscale(${1 - lit}) brightness(${0.5 + 0.55 * lit}) saturate(${0.6 + 0.6 * lit})`} shots={[
            { src: 'summit-sit', at: 0, z0: 1.18, z1: 1.06, pos: 'center 60%' },
            { src: 'summit-dusk', at: cMean, tr: 'wipeUp', z0: 1.04, z1: 1.14, pos: 'center 70%' },
          ]} />
          <div style={{ position: 'absolute', left: 0, right: 0, top: 640, height: 640, background: 'linear-gradient(to bottom, rgba(11,9,6,0.8), rgba(11,9,6,0.1) 45%, rgba(11,9,6,0.92))' }} />

          {/* top label */}
          <Label lt={lt} cue={cDeep} top={402} text="Deeply devoted" color={GOLD} />
          <div style={{ position: 'absolute', left: 52, top: 436, fontFamily: SERIF, fontStyle: 'italic', fontWeight: 700, fontSize: 70, color: CREAM, textShadow: TS, padding: '0 6px 8px', ...reveal(lt, cStr, 0.55) }}>&amp; struggling</div>

          {/* seam + vs medallion */}
          <div style={{ position: 'absolute', left: 0, right: 0, top: 638, height: 4, background: GOLD, transform: `scaleX(${seam})`, boxShadow: '0 0 18px rgba(242,196,109,0.6)' }} />
          <div style={{
            position: 'absolute', left: 360 - 40, top: 640 - 40, width: 80, height: 80, borderRadius: 40,
            background: BG, border: `3px solid ${GOLD2}`, display: 'flex', alignItems: 'center', justifyContent: 'center',
            fontFamily: SERIF, fontStyle: 'italic', fontWeight: 700, fontSize: 36, color: GOLD2, ...pop(lt, cArent),
          }}>vs</div>

          {/* bottom label */}
          <Label lt={lt} cue={cArent} top={746} text="Not very religious" color={GOLD2} />
          <div style={{ position: 'absolute', left: 52, top: 780, fontFamily: SERIF, fontStyle: 'italic', fontWeight: 700, fontSize: 70, color: CREAM, textShadow: TS, padding: '0 6px 8px', ...reveal(lt, cSucc - 0.2, 0.55) }}>&amp; at peace</div>
          <div style={{ position: 'absolute', left: 48, right: 48, top: 890, display: 'flex', gap: 12, justifyContent: 'flex-start' }}>
            <Chip size={30} style={{ ...pop(lt, cSucc), padding: '4px 18px 7px' }}>successful</Chip>
            <Chip size={30} style={{ ...pop(lt, cMean), padding: '4px 18px 7px' }}>meaningful</Chip>
            <Chip size={30} style={{ ...pop(lt, cPeace), padding: '4px 18px 7px' }}>peaceful</Chip>
          </div>

          {/* the verdict band opens over the seam */}
          <div style={{
            position: 'absolute', left: 32, right: 32, top: 552, height: 176, borderRadius: 14,
            background: 'rgba(11,9,6,0.93)', border: `2px solid ${GOLD}`,
            transform: `scaleY(${band})`, opacity: clamp((lt - cSo) / 0.1, 0, 1),
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
            boxShadow: '0 20px 60px rgba(0,0,0,0.6)',
          }}>
            <div style={{ fontFamily: SERIF, fontWeight: 700, fontSize: 56, color: CREAM, lineHeight: 1.1, ...rise(lt, cSo + 0.1, 0.4) }}>Devotion alone</div>
            <div style={{ fontFamily: SERIF, fontStyle: 'italic', fontWeight: 500, fontSize: 48, color: GOLD2, lineHeight: 1.2, padding: '0 6px 4px', ...reveal(lt, cDec, 0.5) }}>doesn’t decide it.</div>
          </div>
          <SubtitleRail sceneIdx={2} bottom={170} fontSize={26} variant="clean" accentColor={GOLD2} />
        </Enter>
      );
    }}</Sprite>
  );
}

// ── Scene 3 · What success depends on: a list that builds ─────────────────────
function Scene3() {
  const win = useSceneWindow(3);
  const cSuccess = useWordCue(3, "success seems");
  const c0 = useWordCue(3, "aware");
  const c1 = useWordCue(3, "understand");
  const c2 = useWordCue(3, "disciplined");
  const c3 = useWordCue(3, "push yourself");
  const c4 = useWordCue(3, "react");
  const c5 = useWordCue(3, "think");
  const c6 = useWordCue(3, "take risks");
  const c7 = useWordCue(3, "failure");
  const c8 = useWordCue(3, "hard times");
  const cThese = useWordCue(3, "these things");
  const rows = [
    [c0, 'Awareness'], [c1, 'Understanding'], [c2, 'Discipline'], [c3, 'Pushing yourself'], [c4, 'How you react'],
    [c5, 'Thinking & adapting'], [c6, 'Taking risks'], [c7, 'Learning from failure'], [c8, 'Getting through'],
  ];
  const Y0 = 236, RH = 66;
  return (
    <Sprite {...win}>{({ localTime: lt, duration }) => {
      let active = -1;
      rows.forEach(([c], i) => { if (lt >= c) active = i; });
      const allOn = lt >= cThese;
      const keys = [[0, Y0], ...rows.map(([c], i) => [c, Y0 + i * RH])];
      const lead = track(lt, keys, 320, 30);
      const trail = track(lt, keys, 140, 22);
      const barTop = Math.min(lead, trail) + 8;
      const barH = Math.abs(lead - trail) + 46;
      const bracket = after(lt, cThese, 0.7);
      return (
        <Enter type="push" lt={lt}>
          <PhotoSeq lt={lt} dur={duration} shots={[
            { src: 'desk-night', at: 0, z0: 1.14, z1: 1.04, x0: 2, x1: 0 },
            { src: 'compass', at: c0, tr: 'dissolve', z0: 1.04, z1: 1.14 },
            { src: 'fog-figure', at: c1, tr: 'blur', z0: 1.16, z1: 1.06, x0: -2, x1: 1 },
            { src: 'runner', at: c2, tr: 'slide', z0: 1.06, z1: 1.16, x0: 2, x1: -2 },
            { src: 'climber', at: c3, tr: 'wipeUp', z0: 1.04, z1: 1.14, y0: 2, y1: -2 },
            { src: 'dark-sea', at: c4, tr: 'zoom', z0: 1.2, z1: 1.06 },

// ── Scene 8 · The walk: a path that draws itself ──────────────────────────────
const P0 = [150, 1160], P1 = [660, 1010], P2 = [40, 720], P3 = [452, 488];
function bez(t) {
  const u = 1 - t;
  const a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
  return [a * P0[0] + b * P1[0] + c * P2[0] + d * P3[0], a * P0[1] + b * P1[1] + c * P2[1] + d * P3[1]];
}
const PATH_PTS = Array.from({ length: 121 }, (_, i) => bez(i / 120));
function Scene8() {
  const win = useSceneWindow(8);
  const cDecide = useWordCue(8, "doesnt decide");

  return (
    <Sprite {...win}>{({ localTime: lt, duration }) => {
      const p = Easing.easeInOutSine(clamp((lt - cBut) / Math.max(0.5, cGoing + 0.35 - cBut), 0, 1));
      const n = Math.max(1, Math.round(p * 120));
      const drawn = PATH_PTS.slice(0, n + 1).map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
      const head = PATH_PTS[n];
      const faint = after(lt, 0.1, 0.6);
      const pinDim = 1 - 0.5 * after(lt, cChange, 0.5);
      return (
        <Enter type="wipeUp" lt={lt}>
          <PhotoSeq lt={lt} dur={duration} shots={[
            { src: 'walk-dusk', at: 0, z0: 1.04, z1: 1.14, pos: 'center 55%' },
            { src: 'footprints', at: cChange, tr: 'dissolve', z0: 1.16, z1: 1.06, y0: 2, y1: -2 },
          ]} />
          <Grade kind="topbottom" dim={0.15} />
          <svg width="720" height="1280" style={{ position: 'absolute', inset: 0 }}>
            <polyline points={PATH_PTS.map(([x, y]) => `${x},${y}`).join(' ')} fill="none" stroke="rgba(242,196,109,0.7)" strokeWidth="5" strokeDasharray="2 16" strokeLinecap="round" opacity={faint} />
            {p > 0 && <polyline points={drawn} fill="none" stroke={GOLD2} strokeWidth="7" strokeLinecap="round" strokeLinejoin="round" style={{ filter: 'drop-shadow(0 0 10px rgba(242,196,109,0.85))' }} />}
            {p > 0 && <circle cx={head[0]} cy={head[1]} r={11} fill="#fff4d6" style={{ filter: 'drop-shadow(0 0 12px rgba(242,196,109,1))' }} />}
          </svg>
          {/* destination pin */}
          <div style={{ position: 'absolute', left: P3[0] - 22, top: P3[1] - 22, width: 44, height: 44, borderRadius: 22, border: `3px solid ${GOLD2}`, background: 'rgba(11,9,6,0.6)', opacity: pinDim, ...pop(lt, cEnd) }} />
          <div style={{ position: 'absolute', left: 150, top: P3[1] - 14, fontFamily: COND, fontWeight: 700, fontSize: 24, letterSpacing: '0.2em', color: CREAM, textShadow: TS, opacity: pinDim, ...reveal(lt, cEnd + 0.1, 0.4) }}>WHERE YOU END UP</div>

        </Enter>

}
