<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plugins, bring your own everything</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="../../runtime/animations.jsx"></script>
  <script type="text/babel" src="../../styles/motion/kit.jsx"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0B0F19; overflow: hidden; }
    #root { width: 100%; height: 100vh; position: relative; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
// tut-08-plugins · "Plugins, bring your own everything" (motion style)
//
// One colour per plugin kind, the whole video long, so the viewer learns it once:
//   tts = violet · stt = cyan · style = amber · publish = green

const KC = { tts: VIOLET, stt: CYAN, style: WARN, publish: OK };
const KIND_ICON = { tts: 'wave', stt: 'words', style: 'palette', publish: 'send' };

// Local easing helpers (names chosen so they never clash with runtime globals).
const ez = (p) => Easing.easeOutCubic(clamp(p, 0, 1));
const springIn = (dt, k = PUNCH.k, d = PUNCH.d) => (!(dt > 0) ? 0 : dt > 8 ? 1 : spring(dt, k, d));
const snapIn = (dt) => springIn(dt, SNAPPY.k, SNAPPY.d);

// A kind pill: mono, tinted with the kind colour. Static (the parent animates).
function KindTag({ kind, size = 20, style }) {
  const c = KC[kind];
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', padding: '1px 10px 2px', borderRadius: 8,
      fontFamily: MONO, fontWeight: 600, fontSize: size, lineHeight: 1.3, color: mix(c, '#FFFFFF', 0.3),
      background: alpha(c, 0.16), border: `1.5px solid ${alpha(c, 0.5)}`, whiteSpace: 'nowrap', ...style }}>
      {kind}
    </span>
  );
}

// ── Scene 1 · hook: swap it, add it ─────────────────────────────────────────
// Dashed ring around the tts slot: red "?" on "voice provider", green check once
// the replacement tile has docked.
function SwapRing({ cx, cy, at, fixAt }) {
  const { localTime: lt } = useSprite();
  const dt = lt - at;
  if (!(dt >= 0)) return null;
  const s = springIn(dt);
  const fixed = lt >= fixAt;
  const f = fixed ? ez((lt - fixAt) / 0.3) : 0;
  const c = fixed ? mix(DANGER, OK, f) : DANGER;
  const glowC = f > 0.5 ? OK : DANGER;
  const q = fixed ? springIn(lt - fixAt) : 1;
  const W = 190;
  const H = 130;
  return (
    <div data-bleed="" style={{ position: 'absolute', left: cx - W / 2, top: cy - H / 2, width: W, height: H,
      pointerEvents: 'none', zIndex: 4, opacity: clamp(dt / 0.12, 0, 1), transform: `scale(${1.22 - 0.22 * s})` }}>
      <div style={{ position: 'absolute', inset: 0, borderRadius: 28, border: `3px ${f > 0.5 ? 'solid' : 'dashed'} ${c}`,
        boxShadow: `0 0 26px ${alpha(glowC, 0.42)}, inset 0 0 18px ${alpha(glowC, 0.16)}` }} />
      <div style={{ position: 'absolute', right: -18, top: -18, width: 44, height: 44, borderRadius: '50%', background: c,
        display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: `0 6px 18px ${alpha(glowC, 0.5)}`,
        transform: `scale(${0.55 + 0.45 * q})` }}>
        {f > 0.5
          ? <Icon name="check" size={26} color={INK} stroke={3.4} />
          : <span style={{ fontFamily: DISPLAY, fontWeight: 800, fontSize: 28, color: INK, lineHeight: 1 }}>?</span>}
      </div>
    </div>
  );
}

// The empty right-hand socket: dashed slot + a "+" that wakes up on "somewhere new".
function OpenSocket({ cx, cy, barX, at, hotAt }) {
  const { localTime: lt } = useSprite();
  const a = ez((lt - at) / 0.4);
  if (a <= 0) return null;
  const hot = lt >= hotAt;
  const h = hot ? ez((lt - hotAt) / 0.3) : 0;
  const breathe = hot ? 0.5 + 0.5 * Math.sin((lt - hotAt) * 8) : 0;
  const ps = 1 + 0.35 * springIn(lt - hotAt);
  const col = hot ? CYAN : '#FFFFFF';
  return (
    <div data-bleed="" style={{ position: 'absolute', left: 0, top: 0, width: 720, height: 1280, pointerEvents: 'none', opacity: a }}>
      <div style={{ position: 'absolute', left: barX, top: cy - 3, width: 34, height: 6, borderRadius: 4,
        background: alpha(col, 0.14 + 0.45 * h) }} />
      <div style={{ position: 'absolute', left: cx - 78, top: cy - 48, width: 156, height: 96, borderRadius: 20,
        border: `2px dashed ${alpha(col, 0.24 + 0.55 * h)}`, background: alpha(col, 0.03 + 0.07 * h),
        boxShadow: hot ? `0 0 ${18 + 18 * breathe}px ${alpha(CYAN, 0.16 + 0.22 * breathe)}` : 'none',
        display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ transform: `scale(${ps})` }}>
          <Icon name="plus" size={30} color={alpha(col, 0.4 + 0.6 * h)} stroke={2.6} />
        </div>
      </div>
    </div>
  );
}

// What the swap and the add changed, spelled out under the dock in readable type.
function ChangeRow({ kind, children, verb, verbTone, at, verbAt, first }) {
  const { localTime: lt } = useSprite();
  const grow = ez((lt - at) / 0.3); // the card grows a row at a time instead of holding empty space
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 14, height: 54 * grow, overflow: grow < 1 ? 'hidden' : 'visible',
      borderTop: first ? 'none' : '1px solid rgba(255,255,255,0.07)', ...enter.push(lt - at, 'left', 60) }}>
      <KindTag kind={kind} size={24} />
      {children}
      <div style={{ marginLeft: 'auto' }}>
        <Badge at={verbAt} variant={verbTone} size={18}>{verb}</Badge>
      </div>
    </div>
  );
}

function Scene1() {
  const win = useSceneWindow(1);
  const cueVoice = useWordCue(1, "voice provider");
  const cueSwap = useWordCue(1, "swap it");
  const cueNew = useWordCue(1, "somewhere new");
  const cueAdd = useWordCue(1, "add it");
  const cueReelsmith = useWordCue(1, "reelsmith");
  const cuePlugins = useWordCue(1, "plugins");
  // Dock geometry (PluginDock 620 × 520 at y 236): core centre (360, 496),
  // left slot centre (133, 496), right slot centre (587, 496), core right edge x 475.
  const mono = { fontFamily: MONO, fontSize: 24, whiteSpace: 'nowrap' };
  return (
    <Sprite {...win}>
      {({ localTime }) => (
        <SceneRoot idx={1}>
          <Glow x={360} y={496} r={340} color={VIOLET} opacity={0.24} breathe={0.04} />
          <Glow x={360} y={496} r={250} color={CYAN} opacity={0.2} breathe={0.05} at={cueReelsmith} />
          <Kicker y={84} at={0}>Episode 08 · Plugins</Kicker>
          {/* the thesis lands whole on "plugins" (0.1 s word stagger) so it reads before scene 2 wipes in on "down" */}
          <Title y={130} size={52} at={cuePlugins} stagger={0.1} text="*Plugins* all|the way down." />
          <OpenSocket cx={587} cy={496} barX={475} at={0.4} hotAt={cueNew} />
          <PluginDock y={236} at={0} core={{ label: 'reelsmith', sub: 'core' }} tiles={[
            { label: 'stt', sub: 'whisper', icon: 'words', color: KC.stt, at: 0.1, slot: 'top' },
            { label: 'style', sub: 'motion', icon: 'palette', color: KC.style, at: 0.2, slot: 'bottom' },
            { label: 'tts', sub: 'openrouter', icon: 'wave', color: KC.tts, at: 0.3, slot: 'left', outAt: cueSwap },
            { label: 'tts', sub: 'elevenlabs', icon: 'wave', color: KC.tts, at: cueSwap + 0.3, slot: 'left' },
            { label: 'publish', sub: 'discord', icon: 'send', color: KC.publish, at: cueAdd, slot: 'right' },
          ]} />
          <SwapRing cx={133} cy={496} at={cueVoice} fixAt={cueSwap + 0.6} />
          <Card y={772} width={580} at={cueVoice} enter="rise" padding="10px 24px">
            <ChangeRow kind="tts" verb="swap" verbTone="violet" at={cueVoice + 0.12} verbAt={cueSwap} first>
              <span style={{ ...mono, color: CODE.text }}><Strike at={cueSwap} thickness={4} rotate={-2}>openrouter</Strike></span>
              <span style={{ display: 'inline-flex', ...enter.pop(localTime - cueSwap - 0.3) }}>
                <Icon name="arrow" size={24} color={CYAN} stroke={2.6} />
              </span>
              <span style={{ ...mono, fontWeight: 600, color: TEXT, ...enter.push(localTime - cueSwap - 0.35, 'left', 30) }}>elevenlabs</span>
            </ChangeRow>
            <ChangeRow kind="publish" verb="add" verbTone="ok" at={cueNew} verbAt={cueAdd}>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, ...enter.pop(localTime - cueAdd) }}>
                <Icon name="plus" size={22} color={OK} stroke={3} />
                <span style={{ ...mono, fontWeight: 600, color: TEXT }}>discord</span>
              </span>
            </ChangeRow>
          </Card>
          <SubtitleRail sceneIdx={1} bottom={150} fontSize={28} variant="clean" accentColor={CYAN} fontFamily="Inter" />
        </SceneRoot>
      )}
    </Sprite>
  );
}

// ── Scene 2 · the four kinds ────────────────────────────────────────────────
function KindTile({ kind, title, role, at, activeAt, activeUntil, children }) {
  const { localTime: lt } = useSprite();
  const c = KC[kind];
  const on = lt >= activeAt ? ez((lt - activeAt) / 0.3) : 0;
  const off = activeUntil != null && lt >= activeUntil ? ez((lt - activeUntil) / 0.4) : 0;
  const a = on * (1 - 0.7 * off);
  return (
    <div style={{ position: 'relative', width: 252, height: 276, ...enter.pop(lt - at) }}>
      <div style={{ position: 'absolute', inset: 0, borderRadius: 22, padding: '22px 22px 0',
        background: `linear-gradient(160deg, ${alpha(c, 0.08 + 0.12 * a)} 0%, ${CODE_BG} 58%)`,
        border: `1.5px solid ${alpha(c, 0.28 + 0.6 * a)}`,
        boxShadow: `${SHADOW}${a > 0 ? `, 0 0 ${46 * a}px ${alpha(c, 0.36 * a)}` : ''}`,
        transform: `translateY(${-6 * a}px)` }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <div style={{ width: 52, height: 52, borderRadius: 15, flexShrink: 0, display: 'flex', alignItems: 'center',
            justifyContent: 'center', background: alpha(c, 0.2) }}>
            <Icon name={KIND_ICON[kind]} size={30} color={c} />
          </div>
          <div style={{ fontFamily: DISPLAY, fontWeight: 700, fontSize: 32, color: TEXT, letterSpacing: '-0.02em' }}>{title}</div>
        </div>
        <div style={{ marginTop: 14, fontFamily: SANS, fontWeight: 500, fontSize: 24, lineHeight: 1.3, color: MUTED,
          textWrap: 'pretty' }}>{role}</div>
        <div style={{ position: 'absolute', left: 22, right: 22, bottom: 20, height: 64 }}>{children}</div>
      </div>
    </div>
  );
}

// STT tile: the real timings of the words the narrator is saying right now.
function TimingRows({ rows }) {
  const { localTime: lt } = useSprite();
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
      {rows.map((r, i) => (
        <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', fontFamily: MONO,
          fontSize: 22, lineHeight: '30px', ...enter.push(lt - r.at, 'left', 40) }}>
          <span style={{ color: CODE.text }}>{r.w}</span>
          <span style={{ color: CYAN, fontWeight: 600 }}>{r.t}</span>
        </div>
      ))}
    </div>
  );
}

// Style tile: a palette + a type sample.
function LookSwatches({ at, aaAt }) {
  const { localTime: lt } = useSprite();
  const cols = [VIOLET, CYAN, OK, WARN];
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', height: 64 }}>
      <div style={{ display: 'flex', gap: 7 }}>
        {cols.map((c, i) => (
          <div key={i} style={{ width: 28, height: 28, borderRadius: '50%', background: c,
            boxShadow: `0 0 14px ${alpha(c, 0.5)}`, ...enter.pop(lt - at - i * 0.1) }} />
        ))}
      </div>
      <div style={{ fontFamily: DISPLAY, fontWeight: 800, fontSize: 40, lineHeight: 1, color: TEXT,
        letterSpacing: '-0.03em', ...enter.pop(lt - aaAt) }}>Aa</div>
    </div>
  );
}

// Publish tile: the film leaves on "sends" and lands on "somewhere".
function SendTrack({ at, sendAt, arriveAt }) {
  const { localTime: lt } = useSprite();
  const p = Easing.easeInOutCubic(clamp((lt - sendAt) / Math.max(0.2, arriveAt - sendAt), 0, 1));
  const arrived = lt >= arriveAt;
  const g = arrived ? springIn(lt - arriveAt) : 0;
  const x0 = 50;
  const x1 = 128;
  return (
    <div style={{ position: 'relative', height: 64, ...enter.fadeIn(lt - at) }}>
      <div style={{ position: 'absolute', left: 0, top: 12, width: 40, height: 40, borderRadius: 11, display: 'flex',
        alignItems: 'center', justifyContent: 'center', background: alpha(OK, 0.14), border: `1.5px solid ${alpha(OK, 0.45)}` }}>
        <Icon name="film" size={22} color={OK} />
      </div>
      <div style={{ position: 'absolute', left: 48, right: 52, top: 31, height: 0, borderTop: `2px dashed ${alpha(OK, 0.35)}` }} />
      {lt >= sendAt && (
        <div style={{ position: 'absolute', left: x0 + (x1 - x0) * p, top: 20, opacity: 1 - ez((lt - arriveAt) / 0.2) }}>
          <Icon name="send" size={24} color={CYAN} />
        </div>
      )}
      <div style={{ position: 'absolute', right: 0, top: 10, width: 44, height: 44, borderRadius: '50%', display: 'flex',
        alignItems: 'center', justifyContent: 'center', background: alpha(OK, 0.1 + 0.2 * g),
        border: `1.5px solid ${alpha(OK, 0.35 + 0.55 * g)}`, boxShadow: g > 0 ? `0 0 ${22 * g}px ${alpha(OK, 0.5 * g)}` : 'none',
        transform: `scale(${0.9 + 0.1 * g})` }}>
        <Icon name="globe" size={26} color={OK} />
      </div>
    </div>
  );
}

function Scene2() {
  const win = useSceneWindow(2);
  const cueFour = useWordCue(2, "four");
  const cueKinds = useWordCue(2, "plugin kinds");
  const cueKindsWord = useWordCue(2, "kinds");
  const cueTts = useWordCue(2, "tts");
  const cueText = useWordCue(2, "text");
  const cueAudio = useWordCue(2, "into audio");
  const cueStt = useWordCue(2, "stt");
  const cueWord = useWordCue(2, "word timings");
  const cueTimings = useWordCue(2, "timings");
  const cueStyle = useWordCue(2, "style");
  const cueDefines = useWordCue(2, "defines");
  const cueLook = useWordCue(2, "look");
  const cuePublish = useWordCue(2, "publish");
  const cueSends = useWordCue(2, "sends");
  const cueSomewhere = useWordCue(2, "somewhere");
  const grid = { position: 'absolute', left: 96, top: 306, width: 528, display: 'flex', flexWrap: 'wrap', gap: 24 };
  return (
    <Sprite {...win}>
      {({ localTime }) => (
        <SceneRoot idx={2} enter="wipe" pattern="grid">
          <Glow x={360} y={580} r={380} color={VIOLET} opacity={0.18} breathe={0.03} />
          <div style={{ position: 'absolute', left: 0, right: 0, top: 112, display: 'flex', justifyContent: 'center' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 26 }}>
              <Counter value={4} at={cueFour} dur={0.6} size={160} gradient enter="pop" />
              <Title ats={[cueKinds, cueKindsWord]} size={52} width={250} align="left" text="plugin|*kinds*" />
            </div>
          </div>
          {/* four empty slots first, so the grid is there before the kinds arrive */}
          <div style={grid}>
            {[0, 1, 2, 3].map((i) => (
              <div key={i} style={{ width: 252, height: 276, borderRadius: 22, border: '2px dashed rgba(255,255,255,0.13)',
                background: 'rgba(255,255,255,0.015)', ...enter.fadeIn(localTime - 0.3 - i * 0.06) }} />
            ))}
          </div>
          <div style={grid}>
            <KindTile kind="tts" title="TTS" role="text → audio" at={cueTts} activeAt={cueTts} activeUntil={cueStt}>
              <Waveform width={208} height={60} bars={18} seed={5} gap={5} speed={0.7} at={cueText} active={[cueAudio, Infinity]} />
            </KindTile>
            <KindTile kind="stt" title="STT" role="audio → word timings" at={cueStt} activeAt={cueStt} activeUntil={cueStyle}>
              <TimingRows rows={[{ w: 'word', t: '5.91s', at: cueWord }, { w: 'timings', t: '6.24s', at: cueTimings }]} />
            </KindTile>
            <KindTile kind="style" title="Style" role="defines a look" at={cueStyle} activeAt={cueStyle} activeUntil={cuePublish}>
              <LookSwatches at={cueDefines} aaAt={cueLook} />
            </KindTile>
            <KindTile kind="publish" title="Publish" role="sends it somewhere" at={cuePublish} activeAt={cuePublish}>
              <SendTrack at={cuePublish + 0.2} sendAt={cueSends} arriveAt={cueSomewhere} />
            </KindTile>
          </div>
          <SubtitleRail sceneIdx={2} bottom={150} fontSize={28} variant="clean" accentColor={CYAN} fontFamily="Inter" />
        </SceneRoot>
      )}
    </Sprite>
  );
}

// ── Scene 3 · the contract: a folder, a plugin.js, one export ──────────────
function Scene3() {
  const win = useSceneWindow(3);
  const cuePlugin = useWordCue(3, "plugin");
  const cueFolder = useWordCue(3, "folder");
  const cuePluginJs = useWordCue(3, "plugin.js");
  const cueFile = useWordCue(3, "file");
  const cueExports = useWordCue(3, "exports");
  const cueName = useWordCue(3, "name");
  const cueKind = useWordCue(3, "kind");
  const cueFunctions = useWordCue(3, "couple of functions");
  const cueWhole = useWordCue(3, "whole contract");
  return (
    <Sprite {...win}>
      {({ localTime }) => {
        // The tree starts centred and a size up, then settles on top when the file opens
        // below it. Only rows that have entered are passed in, so the card grows row by row.
        const settle = snapIn(localTime - cuePluginJs);
        const lift = 232 * (1 - settle);
        const zoom = 1 + 0.2 * (1 - settle);
        const treeRows = [
          { name: 'plugins/', depth: 0, at: 0.4 },
          { name: 'tts-elevenlabs/', depth: 1, at: cuePlugin, hotAt: cueFolder, badge: 'your plugin', badgeAt: cueFolder },
          { name: 'plugin.js', depth: 2, at: cuePluginJs, hotAt: cuePluginJs, badge: 'required', badgeVariant: 'violet' },
          { name: 'README.md', depth: 2, at: cueFile, note: 'docs' },
        ].filter((r) => localTime >= r.at);
        return (
          <SceneRoot idx={3} enter="push">
            <Glow x={360} y={620} r={380} color={CYAN} opacity={0.12} breathe={0.03} />
            <Watermark text="{ }" y={640} size={460} opacity={0.06} color={CYAN} at={0.2} />
            <Kicker y={84} at={0.2}>The contract</Kicker>
            <div style={{ position: 'absolute', left: 0, right: 0, top: 0, transform: `translateY(${lift}px) scale(${zoom})`,
              transformOrigin: '360px 200px' }}>
              <FileTree y={132} at={0.3} rows={treeRows} />
            </div>
            <CodeCard y={396} title="plugins/tts-elevenlabs/plugin.js" at={cuePluginJs + 0.15} fontSize={22} highlight={[
              { line: 0, at: cueExports, until: cueName },
              { line: 1, at: cueName, until: cueKind },
              { line: 2, at: cueKind, until: cueFunctions },
              { line: 4, at: cueFunctions, color: CYAN },
              { line: 5, at: cueFunctions + 0.08, color: CYAN },
              { line: 6, at: cueFunctions + 0.16, color: CYAN },
              { line: 7, at: cueFunctions + 0.24, color: CYAN },
              { line: 8, at: cueFunctions + 0.32, color: CYAN },
            ]} lines={[
              'module.exports = {',
              { text: "  name: 'tts-elevenlabs',", label: 'unique', labelAt: cueName },
              { text: "  kind: 'tts',", label: '1 of 4 kinds', labelTone: 'violet', labelAt: cueKind },
              "  version: '1.0.0',",
              '  async check(ctx) { … },',
              '  async synthesize({ text, voice }) {',
              "    // call your provider's API",
              "    return { audio, format: 'mp3' };",
              '  },',
              '};',
            ]} />
            <Callout y={848} icon="check" color="ok" at={cueWhole} title="That's the whole contract">
              name · kind · version · functions
            </Callout>
            <SubtitleRail sceneIdx={3} bottom={150} fontSize={28} variant="clean" accentColor={CYAN} fontFamily="Inter" />
          </SceneRoot>
        );
      }}
    </Sprite>
  );
}

// ── Scene 4 · register it (config or folder), then `reelsmith plugins` ─────
function OrMedallion({ y, at }) {
  const { localTime: lt } = useSprite();
  return (
    <div style={{ position: 'absolute', left: 360 - 31, top: y - 31, width: 62, height: 62, zIndex: 3, borderRadius: '50%',
      display: 'flex', alignItems: 'center', justifyContent: 'center', border: '2px solid transparent',
      backgroundImage: `linear-gradient(${INK}, ${INK}), ${GRAD_DIAG}`, backgroundOrigin: 'border-box',
      backgroundClip: 'padding-box, border-box', fontFamily: DISPLAY, fontWeight: 700, fontSize: 22, color: TEXT,
      boxShadow: `0 0 24px ${alpha(VIOLET, 0.45)}`, ...enter.pop(lt - at) }}>or</div>
  );
}

function Scene4() {
  const win = useSceneWindow(4);
  const cueRegister = useWordCue(4, "register");
  const cueConfig = useWordCue(4, "reelsmith.config.json");
  const cueOr = useWordCue(4, "or");
  const cueDrop = useWordCue(4, "drop");
  const cueFolder = useWordCue(4, "plugins folder");
  const cueRun = useWordCue(4, "run");
  const cueSee = useWordCue(4, "to see");
  const cueLoaded = useWordCue(4, "loaded");
  return (
    <Sprite {...win}>
      {({ localTime }) => {
        // The config card owns the frame until "or", then makes room for option two.
        const lift = 196 * (1 - snapIn(localTime - cueOr));
        return (
          <SceneRoot idx={4} enter="up" pattern="grid">

// ── Scene 5 · what ships built in ───────────────────────────────────────────
// One shelf per kind; the shells land at scene open, each lights on its words.
function ShelfRow({ kind, role, mono = false, shellAt, at, chips = [], caption, captionAt }) {
  const { localTime: lt } = useSprite();
  const c = KC[kind];
  const lit = lt >= at ? ez((lt - at) / 0.35) : 0;
  return (
    <div style={{ position: 'relative', width: 560, borderRadius: 20, padding: '16px 22px 16px 26px',
      background: lit > 0 ? `linear-gradient(90deg, ${alpha(c, 0.13 * lit)}, ${CARD} 70%)` : CARD,
      border: `1px solid ${lit > 0 ? alpha(c, 0.2 + 0.35 * lit) : CARD_BORDER}`,
      boxShadow: `inset ${4 * lit}px 0 0 ${c}, 0 14px 36px rgba(0,0,0,0.3)`, ...enter.push(lt - shellAt, 'left') }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, height: 34 }}>
        <KindTag kind={kind} size={22} />
        <span style={{ fontFamily: mono ? MONO : SANS, fontWeight: 500, fontSize: mono ? 22 : 24, color: MUTED, whiteSpace: 'nowrap',
          ...enter.wipe(lt - at - 0.1, 0.45) }}>{role}</span>
      </div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 10, marginTop: 12, minHeight: 44 }}>
        {chips.map((ch, i) => (
          <Chip key={i} at={ch.at} mono size={22} color={c} variant="soft">{ch.label}</Chip>
        ))}
      </div>
      {caption && (
        <div style={{ marginTop: 10, height: 30, fontFamily: SANS, fontWeight: 500, fontSize: 24, color: MUTED, whiteSpace: 'nowrap',
          ...enter.slideUp(lt - captionAt) }}>{caption}</div>
      )}
    </div>
  );
}

// Running total of built-ins: punches on every new chip.
function Tally({ times }) {
  const { localTime: lt } = useSprite();
  let n = 0;
  let last = -Infinity;
  for (const tm of times) if (lt >= tm) { n += 1; last = Math.max(last, tm); }
  const s = n > 0 ? springIn(lt - last) : 0;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', opacity: n > 0 ? 1 : 0 }}>
      <div style={{ fontFamily: DISPLAY, fontWeight: 800, fontSize: 124, lineHeight: 1, letterSpacing: '-0.04em',
        fontVariantNumeric: 'tabular-nums', backgroundImage: GRAD, WebkitBackgroundClip: 'text', backgroundClip: 'text',
        color: 'transparent', transform: `scale(${1.22 - 0.22 * s})`, transformOrigin: '80% 60%' }}>{n}</div>
      <div style={{ marginTop: 4, fontFamily: SANS, fontWeight: 600, fontSize: 22, letterSpacing: '0.18em',
        textTransform: 'uppercase', color: MUTED }}>plugins</div>
    </div>
  );
}
