<body>
<div id="root"></div>
<script type="text/babel">
// tut-02-install · Episode 2 of the Reelsmith tutorials: the whole install.
// Series motif: a four-step tracker (tools → init → key → doctor). Scene 1 shows
// it as the roadmap, scenes 2–5 wear it as the header ("you are here"), and on
// "green across the board" in scene 6 every step turns green.

// ── Local helpers ────────────────────────────────────────────────────────────
// spring that is 0 before its start and exactly 1 once settled (no NaN far out)
const sp = (dt, k = SNAPPY.k, d = SNAPPY.d) => (!(dt > 0) ? 0 : dt > 8 ? 1 : spring(dt, k, d));
const e3 = (p) => Easing.easeOutCubic(clamp(p, 0, 1));

const STEPS = ['tools', 'init', 'key', 'doctor'];

// StepTrack: the four install steps as pills joined by short connectors.
//   current  index lit as "you are here" from litAt (earlier steps render done)
//   ats      per-pill entry times (else at + i * 0.07, a scene-open flourish)
//   doneAts  per-pill times at which a step flips to done (green check)
function StepTrack({ y, current = -1, litAt = 0, at = 0, ats, doneAts = [], big = false }) {
  const { localTime: lt } = useSprite();
  const fs = big ? 24 : 22;
  const dot = big ? 34 : 30;
  const numFs = big ? 19 : 18;
  const conW = big ? 16 : 12;
  const pad = big ? '7px 17px 7px 7px' : '6px 14px 6px 6px';
  const state = (i) => {
    const doneAt = doneAts[i] != null ? doneAts[i] : i < current ? -1e9 : Infinity;
    if (lt >= doneAt) return { s: 'done', since: doneAt };
    if (i === current && lt >= litAt) return { s: 'active', since: litAt };
    return { s: 'todo', since: null };
  };
  const nodes = [];
  STEPS.forEach((label, i) => {
    const showAt = ats ? ats[i] : at + i * 0.07;
    const dt = lt - showAt;
    const st = state(i);
    const flip = st.since != null && lt - st.since < 3 ? sp(lt - st.since, PUNCH.k, PUNCH.d) : 1;
    const inS = sp(dt, PUNCH.k, PUNCH.d);
    const scale = (0.6 + 0.4 * inS) * (0.84 + 0.16 * flip);
    const look = st.s === 'done'
      ? { bg: alpha(OK, 0.13), bd: alpha(OK, 0.65), dot: OK, txt: TEXT, glow: `0 0 20px ${alpha(OK, 0.32)}` }
      : st.s === 'active'
        ? { bg: alpha(VIOLET, 0.24), bd: alpha(CYAN, 0.85), dot: GRAD_DIAG, txt: TEXT, glow: `0 0 28px ${alpha(VIOLET, 0.55)}` }
        : { bg: 'rgba(255,255,255,0.045)', bd: 'rgba(255,255,255,0.16)', dot: 'rgba(255,255,255,0.09)', txt: MUTED, glow: 'none' };
    if (i > 0) {
      const prev = state(i - 1);
      const fillAt = prev.s === 'done' ? prev.since : Infinity;
      const f = lt >= fillAt ? e3((lt - fillAt) / 0.3) : 0;
      nodes.push(
        <div key={`c${i}`} style={{ position: 'relative', width: conW, height: 3, margin: '0 3px', borderRadius: 2,
          background: 'rgba(255,255,255,0.14)', opacity: clamp(dt / 0.2, 0, 1), overflow: 'hidden' }}>
          <div style={{ position: 'absolute', inset: 0, background: OK, transform: `scaleX(${f})`, transformOrigin: 'left center' }} />
        </div>
      );
    }
    nodes.push(
      <div key={label} style={{ display: 'flex', alignItems: 'center', gap: big ? 10 : 8, padding: pad, borderRadius: 999,
        background: look.bg, border: `1.5px solid ${look.bd}`, boxShadow: look.glow,
        opacity: clamp(dt / 0.12, 0, 1), transform: `scale(${scale})` }}>
        <div style={{ width: dot, height: dot, borderRadius: '50%', flexShrink: 0, display: 'flex', alignItems: 'center',
          justifyContent: 'center', background: look.dot }}>
          {st.s === 'done'
            ? <Icon name="check" size={Math.round(dot * 0.58)} color={INK} stroke={3.2} />
            : <span style={{ fontFamily: DISPLAY, fontWeight: 700, fontSize: numFs, color: st.s === 'active' ? '#FFFFFF' : FAINT }}>{i + 1}</span>}
        </div>
        <span style={{ fontFamily: SANS, fontWeight: 600, fontSize: fs, color: look.txt, whiteSpace: 'nowrap' }}>{label}</span>
      </div>
    );
  });
  return (
    <div style={{ position: 'absolute', top: y, left: 0, right: 0, display: 'flex', justifyContent: 'center' }}>
      <div style={{ display: 'flex', alignItems: 'center' }}>{nodes}</div>
    </div>
  );
}

// ReqRow: one prerequisite in the scene-2 checklist (icon, name, why, version badge).
function ReqRow({ icon, name, sub, badge, color, at, subAt, badgeAt, first = false }) {
  const { localTime: lt } = useSprite();
  const dt = lt - at;
  const lit = dt >= 0 ? e3(dt / 0.35) : 0;
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 18, padding: '15px 0',
      borderTop: first ? 'none' : '1px solid rgba(255,255,255,0.07)', ...enter.push(dt, 'left') }}>
      <div style={{ width: 60, height: 60, borderRadius: 16, flexShrink: 0, display: 'flex', alignItems: 'center',
        justifyContent: 'center', background: alpha(color, 0.08 + 0.12 * lit), border: `1.5px solid ${alpha(color, 0.25 + 0.4 * lit)}`,
        boxShadow: `0 0 ${26 * lit}px ${alpha(color, 0.35 * lit)}` }}>
        <Icon name={icon} size={32} color={color} />
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontFamily: MONO, fontWeight: 600, fontSize: 30, color: TEXT, lineHeight: 1.15 }}>{name}</div>
        <div style={{ fontFamily: SANS, fontWeight: 500, fontSize: 24, color: MUTED, marginTop: 4, whiteSpace: 'nowrap',
          ...enter.wipe(lt - subAt, 0.5) }}>{sub}</div>
      </div>
      <Badge variant={color} mono upper={false} size={24} at={badgeAt}>{badge}</Badge>
    </div>
  );
}

// Anatomy: a command split into labelled parts (chip + caption), each on its cue.
function Anatomy({ y, parts }) {
  const { localTime: lt } = useSprite();
  return (
    <div style={{ position: 'absolute', top: y, left: 0, right: 0, display: 'flex', justifyContent: 'center', gap: 14 }}>
      {parts.map((p) => (
        <div key={p.code} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>
          <Chip mono size={22} color={p.color} variant="soft" at={p.at}>{p.code}</Chip>
          <div style={{ fontFamily: SANS, fontWeight: 500, fontSize: 24, color: MUTED, whiteSpace: 'nowrap',
            ...enter.slideUp(lt - p.at - 0.1) }}>{p.note}</div>
        </div>
      ))}
    </div>
  );
}

    { icon: 'film', title: 'ffmpeg', sub: 'media', color: CYAN },
    { icon: 'mic', title: 'python', sub: 'whisper', color: VIOLET },
  ];
  return (
    <Sprite {...win}>
      {({ localTime }) => (
        <SceneRoot idx={1}>

          <Glow x={360} y={280} r={340} color={VIOLET} opacity={0.26} breathe={0.04} />
          <Kicker y={112} at={0}>Episode 02 · Install</Kicker>
          <div style={{ position: 'absolute', top: 176, left: 0, right: 0, display: 'flex', justifyContent: 'center', gap: 14 }}>
            {tools.map((tl, i) => (
              <div key={tl.title} style={{ position: 'relative' }}>
                <Tile icon={tl.icon} title={tl.title} sub={tl.sub} color={tl.color} width={164} enter="drop"
                  at={cueThree + i * 0.1} activeAt={cueReady + i * 0.1} style={{ padding: '20px 18px 18px' }} />
                <div style={{ position: 'absolute', top: 16, right: 16, width: 34, height: 34, borderRadius: '50%',
                  background: OK, display: 'flex', alignItems: 'center', justifyContent: 'center',
                  boxShadow: `0 0 18px ${alpha(OK, 0.55)}`, ...enter.pop(localTime - (cueReady + i * 0.1)) }}>
                  <Icon name="check" size={20} color={INK} stroke={3.2} />
                </div>
              </div>
            ))}
          </div>
          <Terminal y={420} title="~" showAt={0.25} command="npx reelsmith init my-channel" at={cueOne} rows={[
            { text: 'created my-channel/', status: 'ok', at: cueReelsmith + 0.15 },
            { text: 'ready', status: 'ok', bold: true, right: 'next: doctor', at: cueReady },
          ]} />
          <div style={{ position: 'absolute', top: 668, left: 0, right: 0, textAlign: 'center', fontFamily: SANS,
            fontWeight: 500, fontSize: 24, color: MUTED, ...enter.slideUp(localTime - cueShow) }}>The whole install, in four steps</div>
          <StepTrack y={712} big current={0} litAt={cueWhole} ats={STEPS.map((_, i) => cueShow + 0.12 + i * 0.12)} />
          <SubtitleRail sceneIdx={1} bottom={150} fontSize={28} variant="clean" accentColor={CYAN} fontFamily="Inter" />
        </SceneRoot>
      )}
    </Sprite>
  );
}

// ── Scene 4 · step 3: the .env key (optional if you record) ─────────────────

  const cuePaste = useWordCue(4, "paste your");
  const cueKey = useWordCue(4, "openrouter key");
  const cueThatKey = useWordCue(4, "that key");
  const cueText = useWordCue(4, "text to speech");
  const cueSpeech = useWordCue(4, "speech");
  const cueRecord = useWordCue(4, "if you record");
  const cueSkip = useWordCue(4, "skip it");
  return (
    <Sprite {...win}>
      {({ localTime }) => {
        const pasted = localTime >= cuePaste;
        const caretOn = Math.floor(localTime * 2) % 2 === 0;
        const keyLine = pasted
          ? 'OPENROUTER_API_KEY=sk-or-v1-••••••'
          : { text: 'OPENROUTER_API_KEY=', segs: [
              { s: 'OPENROUTER_API_KEY', c: CODE.prop }, { s: '=', c: CODE.punct }, { s: caretOn ? '▌' : ' ', c: CYAN },
            ] };
        return (
          <SceneRoot idx={4} enter="push">
            <Glow x={360} y={420} r={330} color={VIOLET} opacity={0.2} breathe={0.03} />
            <StepTrack y={92} current={2} litAt={0.3} />
            <Chip y={168} at={cueOpen} mono icon="terminal" color="cyan" variant="outline">cp .env.example .env</Chip>
            <CodeCard y={246} title="my-channel/.env" width={600} fontSize={22} at={cueOpen + 0.2}

                '# keys for Reelsmith',
                keyLine,
                '# publish tokens: later',
              ]} />
            {/* kit workaround: FlowDiagram paints its dashed connectors before `at`; gate them */}
            <div style={{ opacity: e3((localTime - cueKey) / 0.3) }}>
              <FlowDiagram y={486} direction="horizontal" width={560} at={cueKey} nodes={[

            <SubtitleRail sceneIdx={4} bottom={150} fontSize={28} variant="clean" accentColor={CYAN} fontFamily="Inter" />
          </SceneRoot>
        );
      }}
    </Sprite>
  );
}

            <div style={{ marginTop: 16, fontFamily: MONO, fontSize: 22, color: MUTED, minHeight: 34 }}>
              <Typed text="research → script → voice → render" at={cueKnows} speed={52} cursor={false} />
            </div>
          </Card>
          <Wordmark y={826} size={40} mark underline={false} stagger={0.035} at={cueAlready + 0.1} />
          <Cursor path={[[cueClaude + 0.2, 616, 820], [cueSay - 0.1, 250, 410], [cueMake + 0.3, 540, 560],
            [cueAgent, 606, 462]]} clicks={[cueSay, cueAgent + 0.3]} />
          <SubtitleRail sceneIdx={6} bottom={150} fontSize={28} variant="clean" accentColor={CYAN} fontFamily="Inter" />
        </SceneRoot>
        );
      }}
    </Sprite>
  );
}

function App() {
  return (
    <Stage width={720} height={1280} scenesSrc="scenes.json" background={INK} loop={false} autoplay={true} persistKey="tut-02-install">

      <Scene3 />

      <Scene5 />

}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
