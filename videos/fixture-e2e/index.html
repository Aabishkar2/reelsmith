<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Why Lambda cold starts hurt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="../../runtime/animations.jsx"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0a0a; overflow: hidden; }
    #root { width: 100%; height: 100vh; position: relative; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
// ── Helpers (config/components.md) ───────────────────────────────────────────
function fadeIn(t, dur = 0.4) {
  return Math.min(1, t / dur);
}
function fadeOut(t, totalDur, dur = 0.35) {
  const exitStart = totalDur - dur;
  if (t > exitStart) return 1 - (t - exitStart) / dur;
  return 1;
}
function fade(localTime, duration, inDur = 0.4, outDur = 0.35) {
  return Math.min(fadeIn(localTime, inDur), fadeOut(localTime, duration, outDur));
}
function slideUp(localTime, inDur = 0.45) {
  const t = clamp(localTime / inDur, 0, 1);
  const e = Easing.easeOutCubic(t);
  return { opacity: e, transform: `translateY(${(1 - e) * 22}px)` };
}
// Scene-root entry: 0.3s dissolve so the 0.5s scene overlap reads as a crossfade.
function sceneIn(localTime) {
  return clamp(localTime / 0.3, 0, 1);
}

const COND = "'Barlow Condensed', sans-serif";
const BODY = "'Barlow', sans-serif";
const MONO = "'Courier New', monospace";
const RED = '#c8102e';
const GREEN = '#4caf50';

// ── Small building blocks ────────────────────────────────────────────────────
function SectionLabel({ text, localTime, y = 110 }) {
  const t = clamp(localTime / 0.35, 0, 1);
  return (
    <div style={{
      position: 'absolute', left: 48, top: y, opacity: t,
      fontFamily: COND, fontWeight: 700, fontSize: 22, color: RED,
      letterSpacing: '0.1em', textTransform: 'uppercase',
    }}>{text}</div>
  );
}

function Divider({ localTime, y, delay = 0.3 }) {
  const adj = Math.max(0, localTime - delay);
  const t = Easing.easeOutCubic(clamp(adj / 0.5, 0, 1));
  return (
    <div style={{
      position: 'absolute', left: 48, top: y,
      width: `${t * 60}px`, height: 3, background: RED, borderRadius: 2,
    }}/>
  );
}

function Stat({ value, label, localTime, delay = 0, color = '#fff' }) {
  const adj = Math.max(0, localTime - delay);
  const t = Easing.easeOutBack(clamp(adj / 0.55, 0, 1));
  const op = clamp(adj / 0.3, 0, 1);
  return (
    <div style={{ opacity: op, transform: `scale(${0.7 + 0.3 * t})`, transformOrigin: 'left center' }}>
      <div style={{ fontFamily: COND, fontWeight: 800, fontSize: 96, color, lineHeight: 1 }}>{value}</div>
      <div style={{
        fontFamily: BODY, fontWeight: 500, fontSize: 22, color: 'rgba(255,255,255,0.65)',
        letterSpacing: '0.04em', textTransform: 'uppercase', marginTop: 8,
      }}>{label}</div>
    </div>
  );
}

function FileIcon({ color }) {
  return (
    <div style={{ position: 'relative', width: 30, height: 38, flexShrink: 0 }}>
      <div style={{ position: 'absolute', inset: 0, border: `2px solid ${color}`, borderRadius: 4, background: 'rgba(255,255,255,0.03)' }}/>
      <div style={{ position: 'absolute', left: 7, right: 7, top: 12, height: 2, background: color, opacity: 0.6 }}/>
      <div style={{ position: 'absolute', left: 7, right: 11, top: 19, height: 2, background: color, opacity: 0.6 }}/>
      <div style={{ position: 'absolute', left: 7, right: 7, top: 26, height: 2, background: color, opacity: 0.6 }}/>
    </div>
  );
}

function ObjectRow({ icon, keyName, kind, style }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 18,
      padding: '16px 18px', borderRadius: 10,
      background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.08)',
      ...style,
    }}>
      <FileIcon color={icon} />
      <div style={{ flex: 1, fontFamily: MONO, fontSize: 22, color: '#fff', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{keyName}</div>
      <div style={{ fontFamily: COND, fontWeight: 700, fontSize: 18, color: icon, letterSpacing: '0.08em', textTransform: 'uppercase' }}>{kind}</div>
    </div>
  );
}

function StepRow({ n, title, sub, active, style }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 22, ...style }}>
      <div style={{
        width: 64, height: 64, borderRadius: 32, flexShrink: 0,
        border: `2px solid ${active ? RED : 'rgba(255,255,255,0.3)'}`,
        background: active ? 'rgba(200,16,46,0.15)' : 'transparent',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        fontFamily: COND, fontWeight: 800, fontSize: 32, color: active ? RED : '#fff',
      }}>{n}</div>
      <div>
        <div style={{ fontFamily: COND, fontWeight: 800, fontSize: 40, color: '#fff', lineHeight: 1.05 }}>{title}</div>
        <div style={{ fontFamily: BODY, fontWeight: 400, fontSize: 22, color: 'rgba(255,255,255,0.65)', marginTop: 4 }}>{sub}</div>
      </div>
    </div>
  );
}

// CTA card (cta-end template), rendered inside the final narrated scene and
// bound to the "follow" cue. Pure visual — fade in/out is allowed for CTA.
function CTACard({ localTime, duration, cue }) {
  const local = Math.max(0, localTime - cue);
  const op = fade(local, Math.max(0.01, duration - cue), 0.5, 0.4);
  const t = Easing.easeOutCubic(clamp(local / 0.6, 0, 1));
  return (
    <div style={{
      position: 'absolute', inset: 0, background: '#080c14', opacity: op,
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 28,
      paddingBottom: 160,
    }}>
      <div style={{ width: 16, height: 16, borderRadius: 8, background: RED, boxShadow: '0 0 0 7px rgba(200,16,46,0.2)', transform: `scale(${t})` }}/>
      <div style={{
        fontFamily: COND, fontWeight: 800, fontSize: 54, lineHeight: 1.08,
        color: '#fff', letterSpacing: '-0.01em', textAlign: 'center',
        opacity: t, transform: `translateY(${(1 - t) * 16}px)`,
      }}>
        Follow for more<br/><span style={{ color: RED }}>AWS</span> tips every week
      </div>
      <div style={{ width: 56, height: 3, background: RED, borderRadius: 2, transform: `scaleX(${t})`, transformOrigin: 'center' }}/>
    </div>
  );
}

// ── Scenes ───────────────────────────────────────────────────────────────────
function VideoContent() {
  return (
    <>
      {/* Scene 1 — Typography + bucket diagram: what S3 is */}
      <Sprite {...useSceneWindow(1)}>
        {({ localTime }) => {
          const cueS3      = useWordCue(1, "S3");
          const cueOldest  = useWordCue(1, "oldest");
          const cueStores  = useWordCue(1, "stores");
          const cueFiles   = useWordCue(1, "files");
          const cueLogs    = useWordCue(1, "logs");
          const cueBackups = useWordCue(1, "backups");
          return (
            <div style={{ position: 'absolute', inset: 0, background: '#080c14', zIndex: 1 }}>
              <SectionLabel text="AWS Storage" localTime={localTime} y={110} />
              <Divider localTime={localTime} y={150} />
              <div style={{
                position: 'absolute', left: 48, right: 48, top: 180,
                fontFamily: COND, fontWeight: 800, fontSize: 104, lineHeight: 1, color: '#fff',
                letterSpacing: '-0.01em',
                ...slideUp(Math.max(0, localTime - cueS3), 0.5),
              }}>Amazon <span style={{ color: RED }}>S3</span></div>
              <div style={{
                position: 'absolute', left: 48, right: 48, top: 310,
                fontFamily: BODY, fontWeight: 400, fontSize: 30, lineHeight: 1.45,
                color: 'rgba(255,255,255,0.8)', textWrap: 'pretty',
                ...slideUp(Math.max(0, localTime - cueOldest), 0.45),
              }}>The oldest AWS service. Still the most widely used.</div>

              <div style={{
                position: 'absolute', left: 48, right: 48, top: 470,
                background: '#0d1117', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 14,
                padding: '24px 24px 26px',
                ...slideUp(Math.max(0, localTime - cueStores), 0.45),
              }}>
                <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 18 }}>
                  <div style={{ fontFamily: MONO, fontWeight: 700, fontSize: 24, color: RED }}>s3://my-bucket</div>
                  <div style={{ fontFamily: COND, fontWeight: 700, fontSize: 18, color: 'rgba(255,255,255,0.5)', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Objects</div>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                  <ObjectRow icon="#58a6ff" keyName="files/report.pdf" kind="File"
                    style={slideUp(Math.max(0, localTime - cueFiles), 0.4)} />
                  <ObjectRow icon="#e3b341" keyName="logs/app-09-27.log" kind="Log"
                    style={slideUp(Math.max(0, localTime - cueLogs), 0.4)} />
                  <ObjectRow icon={GREEN} keyName="backups/db.tar.gz" kind="Backup"
                    style={slideUp(Math.max(0, localTime - cueBackups), 0.4)} />
                </div>
              </div>
              <SubtitleRail sceneIdx={1} bottom={200} />
            </div>
          );
        }}
      </Sprite>

      {/* Scene 2 — StatCards + timeline bar: the cold start penalty */}
      <Sprite {...useSceneWindow(2)}>
        {({ localTime }) => {
          const cueLambda    = useWordCue(2, "Lambda");
          const cueServers   = useWordCue(2, "servers to manage");
          const cueStat      = useWordCue(2, "600 milliseconds");
          const cueBefore    = useWordCue(2, "before your function");
          const cueContainer = useWordCue(2, "new container");
          const barT = Easing.easeOutCubic(clamp((localTime - cueBefore) / 0.6, 0, 1));
          return (
            <div style={{ position: 'absolute', inset: 0, background: '#080c14', opacity: sceneIn(localTime), zIndex: 2 }}>
              <SectionLabel text="The Problem" localTime={localTime} y={110} />
              <Divider localTime={localTime} y={150} />
              <div style={{
                position: 'absolute', left: 48, right: 48, top: 180,
                fontFamily: COND, fontWeight: 800, fontSize: 80, lineHeight: 1, color: '#fff',
                ...slideUp(Math.max(0, localTime - cueLambda), 0.5),
              }}>AWS Lambda</div>
              <div style={{
                position: 'absolute', left: 48, right: 48, top: 278,
                fontFamily: BODY, fontWeight: 400, fontSize: 30, color: 'rgba(255,255,255,0.8)',
                ...slideUp(Math.max(0, localTime - cueServers), 0.45),
              }}>Runs your code. <span style={{ textDecoration: 'line-through', color: 'rgba(255,255,255,0.45)' }}>Servers to manage.</span></div>

              <div style={{
                position: 'absolute', left: 48, right: 48, top: 370,
                padding: '28px 30px', borderRadius: 14,
                background: 'rgba(200,16,46,0.1)', border: '1px solid rgba(200,16,46,0.35)',
                ...slideUp(Math.max(0, localTime - cueStat), 0.4),
              }}>
                <div style={{ fontFamily: COND, fontWeight: 700, fontSize: 20, color: RED, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 6 }}>Cold start</div>
                <Stat value="+600ms" label="before your code runs" localTime={localTime} delay={cueStat} color="#fff" />
              </div>

              <div style={{
                position: 'absolute', left: 48, right: 48, top: 640,
                ...slideUp(Math.max(0, localTime - cueBefore), 0.4),
              }}>
                <div style={{ fontFamily: COND, fontWeight: 700, fontSize: 18, color: 'rgba(255,255,255,0.5)', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 10 }}>One invocation</div>
                <div style={{ display: 'flex', height: 64, borderRadius: 10, overflow: 'hidden', border: '1px solid rgba(255,255,255,0.1)', background: 'rgba(255,255,255,0.03)' }}>
                  <div style={{
                    width: `${60 * barT}%`, background: RED, display: 'flex', alignItems: 'center', paddingLeft: 16,
                    fontFamily: COND, fontWeight: 800, fontSize: 22, color: '#fff', letterSpacing: '0.06em', whiteSpace: 'nowrap', overflow: 'hidden',
                  }}>COLD START</div>
                  <div style={{
                    width: `${40 * barT}%`, background: 'rgba(76,175,80,0.25)', display: 'flex', alignItems: 'center', paddingLeft: 16,
                    fontFamily: MONO, fontWeight: 700, fontSize: 20, color: GREEN, whiteSpace: 'nowrap', overflow: 'hidden',
                  }}>handler()</div>
                </div>
              </div>

              <div style={{
                position: 'absolute', left: 48, right: 48, top: 790,
                padding: '18px 22px', borderRadius: 10,
                background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)',
                fontFamily: BODY, fontWeight: 500, fontSize: 26, color: 'rgba(255,255,255,0.85)', lineHeight: 1.4,
                ...slideUp(Math.max(0, localTime - cueContainer), 0.4),
              }}>Every <span style={{ color: RED, fontWeight: 600 }}>new container</span> pays it again.</div>
              <SubtitleRail sceneIdx={2} bottom={200} />
            </div>
          );
        }}
      </Sprite>

      {/* Scene 3 — CodeBlock + StatCard: provisioned concurrency */}
      <Sprite {...useSceneWindow(3)}>
        {({ localTime }) => {
          const cueFix   = useWordCue(3, "provision concurrency");
          const cueWarm  = useWordCue(3, "keeps containers warm");
          const cueReady = useWordCue(3, "ready");
          const cueCost  = useWordCue(3, "30 cents");
          const cueBusy  = useWordCue(3, "busy APIs");
          const cueWorth = useWordCue(3, "worth paying");
          return (
            <div style={{ position: 'absolute', inset: 0, background: '#080c14', opacity: sceneIn(localTime), zIndex: 3 }}>
              <SectionLabel text="The Fix" localTime={localTime} y={110} />
              <Divider localTime={localTime} y={150} />
              <div style={{
                position: 'absolute', left: 48, right: 48, top: 176,
                fontFamily: COND, fontWeight: 800, fontSize: 66, lineHeight: 1.02, color: '#fff', textWrap: 'pretty',
                ...slideUp(Math.max(0, localTime - cueFix), 0.5),
              }}>Provisioned <span style={{ color: RED }}>concurrency</span></div>

              <div style={{
                position: 'absolute', left: 48, right: 48, top: 270,
                background: '#111', border: '1px solid rgba(255,255,255,0.1)', borderRadius: 12, overflow: 'hidden',
                ...slideUp(Math.max(0, localTime - cueWarm), 0.45),
              }}>
                <div style={{ display: 'flex', gap: 8, padding: '12px 16px', background: 'rgba(255,255,255,0.05)' }}>
                  <div style={{ width: 12, height: 12, borderRadius: 6, background: '#ff5f57' }}/>
                  <div style={{ width: 12, height: 12, borderRadius: 6, background: '#febc2e' }}/>
                  <div style={{ width: 12, height: 12, borderRadius: 6, background: '#28c840' }}/>
                </div>
                <div style={{ padding: '18px 22px 20px', fontFamily: MONO, fontSize: 21, lineHeight: 1.5, color: '#fff', whiteSpace: 'pre' }}>
                  <div><span style={{ color: GREEN }}>$</span> <span style={{ color: '#58a6ff' }}>aws lambda</span> \</div>
                  <div>  put-provisioned-concurrency-config \</div>
                  <div>  <span style={{ color: '#a5d6ff' }}>--function-name</span> api \</div>
                  <div>  <span style={{ color: '#a5d6ff' }}>--provisioned-concurrent-executions</span> 5</div>
                  <div style={{ color: '#0f0', marginTop: 8, ...slideUp(Math.max(0, localTime - cueReady), 0.35) }}>✓ Status: READY — 5 warm</div>
                </div>
              </div>

              <div style={{
                position: 'absolute', left: 48, right: 48, top: 590,
                display: 'flex', alignItems: 'center', gap: 24,
                padding: '24px 28px', borderRadius: 14,
                background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.1)',
                ...slideUp(Math.max(0, localTime - cueCost), 0.4),
              }}>
                <Stat value="~$0.30" label="per hour, per warm instance" localTime={localTime} delay={cueCost} color="#fff" />
              </div>

              <div style={{
                position: 'absolute', left: 48, right: 48, top: 810,
                display: 'flex', alignItems: 'center', gap: 16,
                padding: '18px 22px', borderRadius: 10,
                background: 'rgba(76,175,80,0.08)', border: '1px solid rgba(76,175,80,0.3)',
                ...slideUp(Math.max(0, localTime - cueBusy), 0.4),
              }}>
                <div style={{ fontFamily: COND, fontWeight: 800, fontSize: 30, color: '#fff' }}>Busy APIs</div>
                <div style={{ fontFamily: COND, fontWeight: 800, fontSize: 30, color: 'rgba(255,255,255,0.4)' }}>→</div>
                <div style={{ fontFamily: COND, fontWeight: 800, fontSize: 30, color: GREEN, ...slideUp(Math.max(0, localTime - cueWorth), 0.35) }}>Worth paying</div>
              </div>
              <SubtitleRail sceneIdx={3} bottom={200} />
            </div>
          );
        }}
      </Sprite>

      {/* Scene 4 — Decision framework + CTA (cta-end card bound to "follow") */}
      <Sprite {...useSceneWindow(4)}>
        {({ localTime, duration }) => {
          const cueMeasure = useWordCue(4, "measure your cold starts");
          const cuePay     = useWordCue(4, "pay to remove");
          const cueFollow  = useWordCue(4, "follow");
          return (
            <div style={{ position: 'absolute', inset: 0, background: '#080c14', opacity: sceneIn(localTime), zIndex: 4 }}>
              <SectionLabel text="Decision Guide" localTime={localTime} y={110} />
              <Divider localTime={localTime} y={150} />
              <div style={{
                position: 'absolute', left: 48, right: 48, top: 180,
                fontFamily: COND, fontWeight: 800, fontSize: 72, lineHeight: 1.02, color: '#fff', textWrap: 'pretty',
                ...slideUp(Math.max(0, localTime - cueMeasure), 0.5),
              }}>Measure first.<br/><span style={{ color: RED }}>Then</span> pay.</div>

              <div style={{ position: 'absolute', left: 48, right: 48, top: 400, display: 'flex', flexDirection: 'column', gap: 0 }}>
                <StepRow n="1" title="Measure cold starts" sub="Check your p99 init duration" active
                  style={slideUp(Math.max(0, localTime - cueMeasure), 0.4)} />
                <div style={{ width: 2, height: 44, background: 'rgba(255,255,255,0.2)', marginLeft: 31, ...slideUp(Math.max(0, localTime - cuePay), 0.3) }}/>
                <StepRow n="2" title="Pay to remove them" sub="Only if the delay hurts users" active={localTime >= cuePay}
                  style={slideUp(Math.max(0, localTime - cuePay), 0.4)} />
              </div>

              <CTACard localTime={localTime} duration={duration} cue={cueFollow} />
              <SubtitleRail sceneIdx={4} bottom={200} />
            </div>
          );
        }}
      </Sprite>
    </>
  );
}

function App() {
  return (
    <Stage width={720} height={1280} scenesSrc="scenes.json" background="#080c14" loop={false} autoplay={true} persistKey="fixture-e2e">
      <VideoContent />
    </Stage>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
